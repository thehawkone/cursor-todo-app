<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планировщик задач</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="todo-app">
    <h1 class="todo-app__title">Мои задачи</h1>

    <form class="todo-form" id="todo-form">
      <input
        type="text"
        class="todo-form__input"
        id="todo-input"
        placeholder="Введите новую задачу..."
        autocomplete="off"
      >
      <button class="todo-form__button" type="submit">Добавить</button>
    </form>

    <p class="todo-stats" id="todo-stats">0 текущих задач</p>
    <ul class="todo-list" id="todo-list">
     <!-- сюда JS будет добавлять задачи -->
    </ul>

    <div class="info">
      <p class="info__text">
        Для редактирования задачи, кликните на текст задачи.
      </p>
    </div>
  </main>

  <script src="js/app.js" type="module"></script>
</body>
</html>
